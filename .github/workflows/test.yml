# PR과 main 푸시마다 테스트를 자동 실행함 (설계지침 §9, AGENTS.md)
# 3.11: SRS DC-01의 최저 지원 버전 / 3.14: 팀원이 실제로 쓰는 최신 버전
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 테스트
        run: python -m pytest -q
