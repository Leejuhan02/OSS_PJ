[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-check"
version = "0.1.0"
description = "requirements.txt의 전이 의존성까지 펼쳐 라이선스·취약점을 점검하는 웹앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.4",       # web/forms.py가 FormParser(max_fields, max_part_size)를 씀. 1.3 이하는 없음 (R5)
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.13",  # web/forms.py가 python_multipart 이름으로 import 함. 0.0.12 이하는 없음 (R5)
    "packaging>=24",
    "requests>=2.31",       # adapters/pypi_adapter.py (R4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_check = [
    "data/*.json",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
