[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-check"
version = "0.1.0"
description = "requirements.txt의 전이 의존성까지 펼쳐 라이선스·취약점을 점검하는 웹앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "packaging>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_check = [
    "data/*.json",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
